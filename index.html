<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevOps CIE</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f8fafc;
        color: #1e293b;
        text-align: center;
        padding: 80px 20px;
      }

      h1 {
        font-size: 36px;
        margin-bottom: 12px;
      }

      p {
        color: #64748b;
        font-size: 16px;
        line-height: 1.6;
      }

      .tools {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 35px;
      }

      .tool {
        background: white;
        padding: 15px 22px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        font-weight: bold;
      }

      footer {
        margin-top: 55px;
        font-size: 13px;
        color: #94a3b8;
      }
    </style>
  </head>

  <body>
    <h1 color="blue">DevOps CIE</h1>

    <p>
      A simple demonstration of automated deployment, containerization,
      orchestration and monitoring.
    </p>

    <div class="tools">
      <div class="tool">GitHub</div>
      <div class="tool">Jenkins</div>
      <div class="tool">Docker</div>
      <div class="tool">Kubernetes</div>
      <div class="tool">Prometheus</div>
      <div class="tool">Grafana</div>
    </div>

    <footer>
      TY B.Tech Information Technology | DevOps for Scalable Systems
    </footer>
  </body>
</html>
