
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-cie
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-cie
  template:
    metadata:
      labels:
        app: devops-cie
    spec:
      containers:
        - name: website
          image: devops-cie:jenkins
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
